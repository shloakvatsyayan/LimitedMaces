name: LimitedMaces
version: '${version}'
main: org.bonkmc.limitedmaces.LimitedMaces
api-version: '1.21'
authors: [ Pyro ]
website: https://discord.gg/bonknetwork

commands:
  limitedmaces:
    description: View LimitedMaces information, reload the config, or install an update
    usage: /limitedmaces <info|reload|update>
  maces:
    description: View tracked maces, reload config, set limit, or toggle enchanting
    usage: /maces [reload|setlimit <n>|enchanting <on|off>]
    permission: limitedmaces.use
  getuntrackedmace:
    description: Get an untracked mace that bypasses the mace limit
    usage: /getuntrackedmace
    permission: limitedmaces.getuntracked
  clearuntrackedmaces:
    description: Clear all untracked maces
    usage: /clearuntrackedmaces
    permission: limitedmaces.clearuntracked
  removemace:
    description: Remove a mace from the plugin and the world
    usage: /removemace <mace-id>
    permission: limitedmaces.remove

permissions:
  limitedmaces.info:
    default: op
  limitedmaces.update:
    default: op
  limitedmaces.use:
    default: op
  limitedmaces.reload:
    default: op
  limitedmaces.setlimit:
    default: op
  limitedmaces.enchanting:
    default: op
  limitedmaces.getuntracked:
    default: op
  limitedmaces.clearuntracked:
    default: op
  limitedmaces.remove:
    default: op
